
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ODIL ADMIN</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;background:#101323;color:white;font-family:Arial;text-align:center}
.card{max-width:430px;margin:35px auto;background:#202943;padding:24px;border-radius:20px}
h1{color:#ffd34e}
input,button{width:100%;padding:15px;margin:9px 0;border:0;border-radius:11px;font-size:16px}
button{color:white;font-weight:bold;cursor:pointer}
input{background:white}
.login{background:#247cff}
.open{background:#159b62}
.close{background:#d94354}
.logout{background:#535c75}
#message{color:#ffd34e;overflow-wrap:anywhere}
#panel{display:none}
.status{font-size:21px;font-weight:bold}
</style>
</head>
<body>
<div class="card">
<h1>👑 ODIL ADMIN</h1>
<div id="loginBox">
<h3>Вход администратора</h3>
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Пароль">
<button id="loginBtn" class="login" type="button">ВОЙТИ</button>
</div>
<div id="panel">
<h2>Панель управления</h2>
<p id="status" class="status">Проверяем статус...</p>
<button id="openBtn" class="open" type="button">🟢 ОТКРЫТЬ ГОЛОСОВАНИЕ</button>
<button id="closeBtn" class="close" type="button">🔴 ЗАКРЫТЬ ГОЛОСОВАНИЕ</button>
<button id="logoutBtn" class="logout" type="button">ВЫЙТИ</button>
</div>
<p id="message">Загрузка...</p>
</div>

<script>
(async function(){
const URL='https://civihiqlrltacmzbutwv.supabase.co';
const KEY='sb_publishable_q1MG16YPOxWmf0_jCGn55w_JMECsTHD';
const msg=document.getElementById('message');
const loginBox=document.getElementById('loginBox');
const panel=document.getElementById('panel');
const status=document.getElementById('status');

function say(t){msg.textContent=t;}

if(!window.supabase){
 say('Не загрузилась библиотека Supabase. Обнови страницу.');
 return;
}

const db=window.supabase.createClient(URL,KEY,{
 auth:{
  persistSession:true,
  autoRefreshToken:true,
  detectSessionInUrl:true
 }
});

async function checkAdmin(user){
 try{
  if(!user){
   loginBox.style.display='block';
   panel.style.display='none';
   say('Введи Email и пароль.');
   return;
  }

  const {data:admin,error}=await db
   .from('admin_users')
   .select('user_id')
   .eq('user_id',user.id)
   .maybeSingle();

  if(error) throw error;

  if(!admin){
   await db.auth.signOut();
   say('Нет прав администратора!');
   return;
  }

  loginBox.style.display='none';
  panel.style.display='block';
  await refreshStatus();

 }catch(e){say('Ошибка проверки: '+e.message);}
}

async function login(){
 const email=document.getElementById('email').value.trim();
 const password=document.getElementById('password').value;

 if(!email||!password){say('Введи Email и пароль.');return;}

 say('Выполняется вход...');

 try{
  const {data,error}=await db.auth.signInWithPassword({email,password});
  if(error) throw error;

  if(!data.session || !data.user){
   say('Вход выполнен, но сессия не получена. Попробуй снова.');
   return;
  }

  await checkAdmin(data.user);

 }catch(e){say('Ошибка входа: '+e.message);}
}

async function refreshStatus(){
 say('Получаем статус...');
 try{
  const {data,error}=await db.rpc('is_voting_open');
  if(error) throw error;
  status.textContent=data===true?'🟢 ГОЛОСОВАНИЕ ОТКРЫТО':'🔴 ГОЛОСОВАНИЕ ЗАКРЫТО';
  say('Статус обновлён.');
 }catch(e){say('Ошибка статуса: '+e.message);}
}

async function setVoting(value){
 say('Сохраняем настройки...');
 try{
  const {data,error}=await db.auth.getSession();
  if(error) throw error;
  if(!data.session){say('Сессия не найдена. Войди снова.');return;}

  const result=await db.rpc('set_voting_open',{p_open:value});
  if(result.error) throw result.error;
  await refreshStatus();
  say('Настройки сохранены!');
 }catch(e){say('Ошибка: '+e.message);}
}

async function logout(){
 try{
  const {error}=await db.auth.signOut();
  if(error) throw error;
  panel.style.display='none';
  loginBox.style.display='block';
  document.getElementById('password').value='';
  say('Ты вышел из аккаунта.');
 }catch(e){say('Ошибка выхода: '+e.message);}
}

document.getElementById('loginBtn').addEventListener('click',login);
document.getElementById('openBtn').addEventListener('click',()=>setVoting(true));
document.getElementById('closeBtn').addEventListener('click',()=>setVoting(false));
document.getElementById('logoutBtn').addEventListener('click',logout);

try{
 const {data,error}=await db.auth.getSession();
 if(error) throw error;
 await checkAdmin(data.session?.user || null);
}catch(e){say('Ошибка запуска: '+e.message);}
})();
</script>
</body>
</html>
